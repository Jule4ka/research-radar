name: Research Radar

on:
  schedule:
    # Mondays, Wednesdays and Fridays at 07:00 UTC.
    - cron: "0 7 * * 1,3,5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # commit the updated dedupe state
  issues: write             # open the review issue

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar
        env:
          # Optional polite-pool contact; set as a repo variable if you want it.
          OPENALEX_MAILTO: ${{ vars.OPENALEX_MAILTO }}
          # Personal OpenAlex key (own budget, not the shared IP pool).
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python -m radar.main

      - name: Open review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "_No new papers this run._" state/latest_report.md; then
            echo "Nothing new; skipping issue."
          else
            # GitHub caps an issue body at 65,536 chars. The digest is already
            # capped (DIGEST_MAX), but truncate here too so a run never fails.
            body=state/latest_report.md
            if [ "$(wc -c < "$body")" -gt 64000 ]; then
              head -c 64000 "$body" > state/_issue_body.md
              printf '\n\n_Report truncated to fit GitHub'"'"'s issue size limit._\n' \
                >> state/_issue_body.md
              body=state/_issue_body.md
            fi
            gh label create radar --color 5319e7 --force >/dev/null 2>&1 || true
            gh issue create \
              --title "Research Radar — $(date -u +%Y-%m-%d)" \
              --body-file "$body" \
              --label radar
          fi

      - name: Commit updated state
        run: |
          git config user.name "research-radar[bot]"
          git config user.email "noreply@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then
            echo "No state change to commit."
          else
            git commit -m "radar: update seen state"
            git push
          fi
